name: LADS CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: LADS CI / ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Verify source syntax and ownership
        run: |
          python -B scripts/repository_check.py --kind product --mode ownership
          find . \( -path './.git' -o -path './vendor' \) -prune -o -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | xargs -0 -r -n 1 node --check
      - name: Build isolated PWA and verify public assets
        run: |
          set -euo pipefail
          temporary="$(mktemp -d "${RUNNER_TEMP}/lifeos-product.XXXXXX")"
          git archive HEAD | tar -x -C "$temporary"
          cd "$temporary"
          node scripts/build-pwa.mjs dist
          node scripts/check-pwa.mjs dist
          echo "LIFEOS_TEST_ROOT=$temporary" >> "$GITHUB_ENV"
      - name: Run product API and synthetic browser regression
        run: |
          set -euo pipefail
          pw="${RUNNER_TEMP}/product-playwright"
          npm install --prefix "$pw" --no-save --no-package-lock playwright@1.64.1
          npm exec --prefix "$pw" -- playwright install --with-deps chromium
          cd "$LIFEOS_TEST_ROOT"
          LADS_ARTIFACT_DIR="${RUNNER_TEMP}/product-api-evidence" python -B tests/acceptance/notes-api-contract.py
          LIFEOS_PLAYWRIGHT_PATH="$pw/node_modules/playwright" LADS_ARTIFACT_DIR="${RUNNER_TEMP}/product-browser-evidence" node tests/browser/lads-regression.cjs
